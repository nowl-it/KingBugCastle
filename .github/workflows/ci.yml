name: CI

on:
  push:
    paths:
      - "server/**"
      - "requirements.txt"
      - "setup.py"
      - "pytest.ini"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "requirements.txt"
      - "setup.py"
      - "pytest.ini"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest server/tests -q

  launcher-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install launcher test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Test development launcher
        run: python -m pytest server/tests/test_deploy_config.py -q
