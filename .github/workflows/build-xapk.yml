name: Build Private Server XAPK

on:
  workflow_dispatch:
    inputs:
      share_host:
        description: "Your private server host (e.g., kgc.mydomain.com or IP)"
        required: true
      base_xapk_url:
        description: "Direct download URL to the raw King God Castle v171 XAPK"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update 
          sudo apt-get install -y zipalign apksigner default-jre unzip curl wget
          sudo curl -sL -o /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          sudo curl -sL -o /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Install Python Dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download and Extract Base XAPK
        run: |
          mkdir -p apk/xapk_extracted_v171
          wget --tries=3 --timeout=15 -O base.xapk --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "${{ github.event.inputs.base_xapk_url }}"
          unzip base.xapk -d apk/xapk_extracted_v171/
          rm base.xapk

      - name: Setup Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Build XAPK Mod
        env:
          SHARE_HOST: ${{ github.event.inputs.share_host }}
        run: |
          python3 server/build_v171_private.py --share

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingBugCastle_v171
          path: KingBugCastle_v171.xapk
          if-no-files-found: error
