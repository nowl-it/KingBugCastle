name: Update Strife Leaderboard

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests msgpack pycryptodome

      - name: Fetch Latest Leaderboard Data
        env:
          KGC_TOKEN: ${{ secrets.KGC_TOKEN }}
        run: |
          python scripts/update_strife_leaderboard.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/strife-leaderboard-data.json docs/strife-leaderboard.html
          if git diff --staged --quiet; then
            echo "No changes in leaderboard data."
          else
            git commit -m "chore(data): auto-update strife leaderboard [skip ci]"
            git push
          fi
