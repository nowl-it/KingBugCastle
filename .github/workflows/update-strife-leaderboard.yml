name: Update Strife Leaderboard

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: "Client version header to send (default: auto from api/config.py)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests msgpack pycryptodome

      - name: Fetch Latest Leaderboard Data
        env:
          KGC_TOKEN: ${{ secrets.KGC_TOKEN }}
        run: |
          # The ranking API rejects stale client versions (403 NotLatestVersion)
          # before the token is even evaluated. Use the explicit input when given,
          # otherwise derive the version of the bundled client from api/config.py
          # so this job can never drift stale again.
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(python api/version.py)"
          fi
          echo "Sending client version: $VERSION"
          KGC_VERSION="$VERSION" python scripts/update_strife_leaderboard.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/strife-leaderboard-data.json docs/strife-leaderboard.html
          if git diff --staged --quiet; then
            echo "No changes in leaderboard data."
          else
            git commit -m "chore(data): auto-update strife leaderboard [skip ci]"
            git push
          fi
