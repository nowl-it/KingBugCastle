<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KGC Hero Detail - visual baseline</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="screen" aria-label="King God Castle Hero Detail visual baseline">
      <img class="game-render" src="assets/farael-hero-detail-reference.png" alt="Farael Hero Detail rendered by the game client" />
      <button class="hotspot pixel" aria-label="Toggle pixel illustration"></button>
      <button class="hotspot statistics" aria-label="Open statistics"></button>
      <button class="hotspot skill" aria-label="Undulating Mana skill"></button>
      <button class="hotspot hero-tab" aria-label="Hero tab"></button>
      <button class="hotspot growth-tab" aria-label="Growth tab"></button>
      <button class="hotspot profile-tab" aria-label="Profile tab"></button>
      <button class="hotspot skin-tab" aria-label="Skin tab"></button>
      <p class="hint" aria-live="polite">Visual baseline captured from the running v172.0.01 client.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
